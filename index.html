<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25:00</title>
    
    <!-- Inline SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23111111'/><rect y='30' width='64' height='4' fill='%23000'/><text x='32' y='46' fill='%23d6d6d6' font-family='Helvetica Neue, Arial, sans-serif' font-weight='800' font-size='38' text-anchor='middle'>25</text></svg>">
    
    <style>
        :root {
            /* Fullscreen proportions */
            --card-width: 47vw;
            --card-height: 94vh;
            
            /* Font size scaled massively to fill the cards without overflowing */
            --font-size: min(36vw, 75vh); 
            
            /* Center cut line thickness */
            --split-gap: 6px; 
            
            /* Default Dark Mode Colors */
            --bg-color: #000000;
            --card-color: #111111; 
            --text-color: #d6d6d6;
        }

        /* Light Mode Colors - activated via the 'L' key */
        body.light-mode {
            --bg-color: #ffffff; 
            --card-color: #f3f3f3; 
            --text-color: #212121; 
        }

        /* Base page styling */
        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Container for the two cards */
        .clock-container {
            display: flex;
            gap: 2vw; 
            perspective: 2500px;
        }

        /* Individual flip card - expanded to fill the screen */
        .flip-card {
            position: relative;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: 4vmin;
            background-color: var(--card-color);
            transition: background-color 0.3s ease;
        }

        /* The physical gap drawn over the exact center */
        .flip-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: var(--split-gap);
            background-color: var(--bg-color);
            transform: translateY(-50%);
            z-index: 10;
            transition: background-color 0.3s ease;
        }

        /* Halves of the card */
        .half {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: var(--card-color);
            overflow: hidden;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            transition: background-color 0.3s ease;
        }

        .top {
            top: 0;
            border-radius: 4vmin 4vmin 0 0;
            transform-origin: bottom;
        }

        .bottom {
            bottom: 0;
            border-radius: 0 0 4vmin 4vmin;
            transform-origin: top;
        }

        /* The large numbers */
        .text {
            position: absolute;
            left: 0;
            width: 100%;
            height: var(--card-height);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: var(--font-size);
            font-weight: 800; 
            letter-spacing: -0.02em;
            
            /* The native fix to stop horizontal shifting - treats numbers as equal widths */
            font-variant-numeric: tabular-nums;
        }

        /* Top half anchors the full-height text to the top */
        .top .text {
            top: 0;
        }

        /* Bottom half anchors the full-height text to the bottom */
        .bottom .text {
            bottom: 0;
        }

        /* Layering for the 3D effect */
        .static-top { z-index: 1; }
        .static-bottom { z-index: 1; }
        .animated-top { z-index: 3; }
        .animated-bottom { z-index: 4; transform: rotateX(90deg); }

        /* Animation Keyframes */
        .animated-top.flip {
            animation: flipTop 0.3s ease-in forwards;
        }
        .animated-bottom.flip {
            animation: flipBottom 0.3s ease-out 0.3s forwards;
        }

        @keyframes flipTop {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipBottom {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        /* Stacking layout for mobile screens so it remains fullscreen in portrait */
        @media (max-aspect-ratio: 1/1) {
            .clock-container {
                flex-direction: column;
                gap: 2vh;
            }
            :root {
                --card-width: 94vw;
                --card-height: 47vh;
                --font-size: min(75vw, 36vh);
            }
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <!-- Minutes Card -->
        <div class="flip-card" id="card-minutes">
            <div class="half top static-top"><div class="text">25</div></div>
            <div class="half bottom static-bottom"><div class="text">25</div></div>
        </div>

        <!-- Seconds Card -->
        <div class="flip-card" id="card-seconds">
            <div class="half top static-top"><div class="text">00</div></div>
            <div class="half bottom static-bottom"><div class="text">00</div></div>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60; // Default 25 minutes
        let isWorking = true;   
        let isRunning = false;  
        let timerId;

        // Automatically match system preference for light/dark mode on load
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.body.classList.add('light-mode');
        }

        function flipCard(cardId, newValue) {
            const card = document.getElementById(cardId);
            const staticTop = card.querySelector('.static-top .text');
            const staticBottom = card.querySelector('.static-bottom .text');
            
            const currentValue = staticTop.textContent;
            
            if (currentValue === String(newValue)) return;

            staticTop.textContent = newValue;

            const animatedTop = document.createElement('div');
            animatedTop.className = 'half top animated-top flip';
            animatedTop.innerHTML = `<div class="text">${currentValue}</div>`;
            
            const animatedBottom = document.createElement('div');
            animatedBottom.className = 'half bottom animated-bottom flip';
            animatedBottom.innerHTML = `<div class="text">${newValue}</div>`;

            card.appendChild(animatedTop);
            card.appendChild(animatedBottom);

            setTimeout(() => {
                staticBottom.textContent = newValue;
                animatedTop.remove();
                animatedBottom.remove();
            }, 600);
        }

        function updateDisplay() {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            
            let sStr = s < 10 ? '0' + s : s.toString();
            let mStr = m < 10 ? '0' + m : m.toString(); 

            document.title = `${mStr}:${sStr}`; 

            flipCard('card-minutes', mStr);
            flipCard('card-seconds', sStr);
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
            } else {
                isRunning = true;
                updateDisplay(); 
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                    } else {
                        isWorking = !isWorking;
                        timeLeft = isWorking ? 25 * 60 : 5 * 60;
                    }
                    updateDisplay();
                }, 1000);
            }
        }

        updateDisplay();

        // Keyboard Event Listeners
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault(); // Stop page scroll
                toggleTimer();
            }
            if (event.code === 'KeyL') {
                // Press 'L' to toggle light mode
                document.body.classList.toggle('light-mode');
            }
        });
    </script>

</body>
</html>
